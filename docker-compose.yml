version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: collegeai_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./collegeai.db
      - SECRET_KEY=collegeai_hackathon_super_secret_jwt_key_2026
    volumes:
      - ./backend:/app
    restart: always

  # Reserved for Frontend integration (Member 2)
