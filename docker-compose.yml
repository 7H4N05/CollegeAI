version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: collegeai_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=sqlite:///./collegeai.db
      - SECRET_KEY=collegeai_hackathon_super_secret_jwt_key_2026
    volumes:
      - ./collegeai.db:/app/collegeai.db
    restart: always

