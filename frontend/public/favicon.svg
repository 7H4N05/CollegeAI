<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="capGrad" x1="100" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="url(#accentGrad)" stroke-width="8" stroke-opacity="0.3" fill="none" />

  <!-- AI Glow Ring -->
  <circle cx="256" cy="256" r="160" stroke="url(#accentGrad)" stroke-width="12" stroke-opacity="0.2" fill="none" />

  <!-- Graduation Cap Icon -->
  <path d="M256 128L64 224L256 320L448 224L256 128Z" fill="url(#capGrad)" filter="url(#glow)" />
  <path d="M144 274V346C144 346 192 384 256 384C320 384 368 346 368 346V274L256 330L144 274Z" fill="#4f46e5" opacity="0.9" />
  
  <!-- Cap Tassel & Node -->
  <circle cx="256" cy="224" r="14" fill="#38bdf8" />
  <path d="M400 248V340C400 355 388 368 372 368C356 368 344 355 344 340" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" fill="none" />

  <!-- AI Sparkles -->
  <path d="M416 112L424 136L448 144L424 152L416 176L408 152L384 144L408 136L416 112Z" fill="#38bdf8" />
  <path d="M112 368L118 384L134 390L118 396L112 412L106 396L90 390L106 384L112 368Z" fill="#c084fc" />
</svg>